[build-system]
requires = ["pdm-backend >= 2.4.0"]
build-backend = "pdm.backend"

[tool.pdm.build]
includes = ["src/tkAppFramework/*.py"]
source-includes = ["tests/", "src/tkAppFramework/Documentation/Developer_Documentation.txt", "src/tkAppFramework/Documentation/uml_class_diagram.pptx", "src/tkAppFramework/Help/*", "src/tkAppFramework/tkAppFramework.sln", "src/tkAppFramework/tkAppFramework.pyproj"]

[tool.pdm.build.wheel-data]
# Recursively install all files from Help/ to the $prefix/data directory,
# while preserving the directory structure (thanks to relative-to).
# We make the destination paths relative to "."
# to preserve the exact same directory structure in the destination:
# Help/help_1.txt -> $prefix/Help/help_1.txt
# data = [{path = "src/tkAppFramework/Help/**/*", relative-to = "."}]
data = [{path = "src/tkAppFramework/Help/**/*", relative-to = "src/tkAppFramework/"}]

[project]
name = "tkAppFramework"
version = "0.9.5"
dependencies = [
	"matplotlib>=3.11.0",
	"justhtml>=1.9.0",
	"markdown>=3.10.2",
	"UserResponseCollector>=1.1.0"
]
authors = [
  { name="Kevin R. Geurts", email="kevin.r.geurts@gmail.com" },
]
description = "tkAppFramework facilitates the creation of python GUI applications using tkinter."
readme = "README.md"
requires-python = ">=3.12"
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Development Status :: 4 - Beta",
  "Environment :: Win32 (MS Windows)",
  "Environment :: X11 Applications",
  "Intended Audience :: Developers",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Software Development :: User Interfaces",
]
license = "MIT"
license-files = ["LICEN[CS]E*"]
keywords = ["query", "GUI", "desktop", "framework", "simulator", "tkinter", "help", "MVC"]

[project.urls]
Homepage = "https://github.com/KevinRGeurts/tkAppFramework"
Issues = "https://github.com/KevinRGeurts/tkAppFramework/issues"
